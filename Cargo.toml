[workspace]
members = ["blox-core", "blox-server", "blox-agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Benchmarks need a release-like profile that keeps debug symbols for perf.
[profile.bench]
opt-level = 3
lto = true
debug = true
