<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>blox-agent dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px;
  }
  h1 { font-size: 18px; margin: 0; }
  .badge {
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .badge.live { background: #1f6feb33; color: var(--accent); }
  .badge.training { background: #3fb95033; color: var(--green); }
  .badge.off { background: #f8514933; color: var(--red); }
  .price { font-size: 22px; font-weight: 700; color: var(--accent); }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  tr.run-row { cursor: pointer; }
  tr.run-row:hover { background: #21262d; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .scroll { max-height: 480px; overflow-y: auto; }
  button {
    background: var(--accent); color: #0d1117; border: none;
    padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btnrow { display: flex; gap: 8px; margin: 12px 0; }
  .detail { margin-top: 16px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  canvas { width: 100%; height: 220px; display: block; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .meta { display: flex; gap: 20px; margin: 8px 0 12px; flex-wrap: wrap; }
  .meta div { font-size: 12px; color: var(--muted); }
  .meta b { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>blox-agent</h1>
    <span id="conn" class="badge off">connecting</span>
    <span id="train" class="badge off">idle</span>
    <div class="price" id="price">—</div>
    <div class="muted" id="progress"></div>
    <div class="btnrow" style="margin-left:auto;margin:0">
      <button id="startBtn">Start</button>
      <button id="stopBtn" class="ghost">Stop</button>
    </div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>Training runs (click a row for details)</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>#</th><th>Agent</th><th>Features</th><th>Model</th>
                <th>Ep</th><th>PnL</th><th>Sharpe</th></tr>
          </thead>
          <tbody id="runsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Best results</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Agent</th><th>Features</th><th>Model</th>
                <th>PnL</th><th>Sharpe</th><th>Win</th><th>Trades</th></tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="detail" id="detail" hidden>
    <div class="detail-grid">
      <div class="panel">
        <h2>Equity curve — <span id="dName"></span></h2>
        <canvas id="equityCanvas"></canvas>
      </div>
      <div class="panel">
        <h2>Episode rewards</h2>
        <canvas id="rewardCanvas"></canvas>
      </div>
    </div>
    <div class="meta">
      <div>Agent <b id="dAgent"></b></div>
      <div>Features <b id="dFeat"></b></div>
      <div>Model <b id="dModel"></b></div>
      <div>Episode <b id="dEp"></b></div>
      <div>PnL <b id="dPnl"></b></div>
      <div>Sharpe <b id="dSharpe"></b></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;

async function getJSON(url) {
  const r = await fetch(url);
  return r.json();
}

function fmtPnl(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
}

function pnlClass(v) {
  const n = parseFloat(v);
  return isNaN(n) || n >= 0 ? "pos" : "neg";
}

function color(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return "#8b949e";
  return n >= 0 ? "#3fb950" : "#f85149";
}

async function poll() {
  try {
    const st = await getJSON("/api/status");
    $("price").textContent = st.price > 0 ? "$" + st.price.toFixed(2) : "—";
    $("progress").textContent = st.training
      ? `${st.completed}/${st.total} done · ${st.active} active · buys=${st.debug_buys} sells=${st.debug_sells} holds=${st.debug_holds}`
      : `${st.completed}/${st.total} complete`;
    $("train").textContent = st.training ? "training" : "idle";
    $("train").className = "badge " + (st.training ? "training" : "off");
    $("conn").textContent = st.connected ? "connected" : "offline";
    $("conn").className = "badge " + (st.connected ? "live" : "off");
    return st;
  } catch { return null; }
}

function renderRuns(runs) {
  const tbody = $("runsBody");
  tbody.innerHTML = "";
  runs.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.className = "run-row";
    tr.innerHTML = `<td>${i}</td><td>${r.agent}</td><td>${r.features}</td>
      <td>${r.model}</td><td>${r.episode}</td>
      <td class="${pnlClass(r.pnl)}">${fmtPnl(r.pnl)}</td>
      <td class="${pnlClass(r.sharpe)}">${r.sharpe}</td>`;
    tr.onclick = () => selectRun(i);
    if (i === selected) tr.style.background = "#21262d";
    tbody.appendChild(tr);
  });
}

function renderResults(results) {
  const tbody = $("resultsBody");
  tbody.innerHTML = "";
  results.forEach((r) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.agent}</td><td>${r.features}</td><td>${r.model}</td>
      <td class="${pnlClass(r.pnl)}">${fmtPnl(r.pnl)}</td>
      <td class="${pnlClass(r.sharpe)}">${r.sharpe}</td>
      <td>${r.win_rate}</td><td>${r.trades}</td>`;
    tbody.appendChild(tr);
  });
}

function drawCurve(canvas, data, colorStr) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = canvas.clientHeight * 2;
  ctx.clearRect(0, 0, w, h);
  if (!data || data.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "14px sans-serif";
    ctx.fillText("no data yet", 20, 40);
    return;
  }
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  ctx.strokeStyle = colorStr;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / span) * (h - 20) - 10;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

async function selectRun(idx) {
  selected = idx;
  const r = await getJSON("/api/run/" + idx);
  $("detail").hidden = false;
  $("dName").textContent = `${r.agent} / ${r.features} / ${r.model}`;
  $("dAgent").textContent = r.agent;
  $("dFeat").textContent = r.features;
  $("dModel").textContent = r.model;
  $("dEp").textContent = r.episode;
  $("dPnl").textContent = r.pnl;
  $("dSharpe").textContent = r.sharpe;
  drawCurve($("equityCanvas"), r.equity_curve, "#58a6ff");
  drawCurve($("rewardCanvas"), r.ep_rewards, "#3fb950");
}

async function loop() {
  const st = await poll();
  if (st) {
    try {
      renderRuns(await getJSON("/api/runs"));
      renderResults(await getJSON("/api/results"));
    } catch {}
    if (selected !== null) selectRun(selected);
  }
  setTimeout(loop, 1000);
}

$("startBtn").onclick = () => fetch("/api/start", { method: "POST" });
$("stopBtn").onclick = () => fetch("/api/stop", { method: "POST" });

loop();
</script>
</body>
</html>
