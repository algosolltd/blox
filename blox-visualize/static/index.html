<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blox-visualize</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b61ff'/%3E%3Cpath d='M9 21V11h6a3.5 3.5 0 0 1 0 7H9zm0 0h7a3.5 3.5 0 1 1 0 7H9v-7z' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <div class="inst-chip">
    <span class="inst-icon">B</span>
    <span class="inst-name" id="inst-name">BLOX/USD</span>
    <span class="sim-badge" title="Synthetic market — blox-sim agents, not real flow">SIM</span>
    <span class="star" title="It's a demo instrument. It loves you back.">☆</span>
  </div>
  <div class="stat"><label>Last price</label><span id="h-last" class="big mono">—</span></div>
  <div class="stat"><label>Change</label><span id="h-change" class="mono">—</span></div>
  <div class="stat"><label>High</label><span id="h-high" class="mono">—</span></div>
  <div class="stat"><label>Low</label><span id="h-low" class="mono">—</span></div>
  <div class="stat"><label>Volume</label><span id="h-vol" class="mono">—</span></div>
  <div class="stat"><label>Spread</label><span id="h-spread" class="mono">—</span></div>
  <div class="stat"><label>Engine</label><span id="h-engine" class="mono">—</span></div>
  <div class="spacer"></div>
  <div class="header-tools">
    <button id="snap-toggle" class="hdr-btn on" aria-pressed="true"
      title="Magnetic edges — panels snap to each other and to the canvas (hold Alt to override)">
      <span class="ic" aria-hidden="true"></span> Snap
    </button>
    <button id="lock-toggle" class="hdr-btn" aria-pressed="false"
      title="Lock the layout so panels can't be moved or resized by accident">
      <span class="ic" aria-hidden="true"></span> <span id="lock-label">Unlocked</span>
    </button>
    <div id="conn" class="conn"><span class="dot"></span><span id="conn-text">connecting</span></div>
  </div>
</header>

<!-- The canvas is a free-form workspace: static/components/portal.js drops
     one absolutely-positioned <section class="portal-panel"> per registered
     panel here, wires the drag/resize/collapse/maximise gestures on it, and
     mounts the actual blox-visualize component into its .panel-body. -->
<main id="canvas">
  <div class="snap-guide v" id="guide-v" aria-hidden="true"></div>
  <div class="snap-guide h" id="guide-h" aria-hidden="true"></div>
</main>

<div id="dock" role="toolbar" aria-label="Panels"></div>

<div id="toasts"></div>

<footer id="statusbar">
  <span id="f-status">starting…</span>
  <span class="spacer"></span>
  <span id="f-engine" class="mono muted"></span>
</footer>

<script src="/vendor/lightweight-charts.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
